name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create .env.local
      run: |
        cp env.example .env.local
        echo "NEXT_PUBLIC_NETWORK=polygon_zkevm" >> .env.local
        echo "NEXT_PUBLIC_RPC_URL=https://your-polygon-zkevm-rpc-url.com" >> .env.local
        echo "NEXT_PUBLIC_CHAIN_ID=1101" >> .env.local
        echo "NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID=your_wallet_connect_project_id" >> .env.local
        echo "NEXT_PUBLIC_BASE_PATH=" >> .env.local
        echo "NEXT_PUBLIC_ASSET_PREFIX=" >> .env.local
        echo "NODE_ENV=production" >> .env.local
        
    - name: Build
      run: npm run build
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        force_orphan: true 